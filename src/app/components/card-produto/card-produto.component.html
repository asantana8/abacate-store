<mat-card class="h-100 cartao-produto">
  <img
    mat-card-image
    class="imagem-produto"
    [src]="produto().imagemUrl"
    [alt]="produto().nome"
  >

  <mat-card-header>
    <mat-card-title>{{ produto().nome }}</mat-card-title>
    <mat-card-subtitle>{{ produto().subtitulo }}</mat-card-subtitle>
  </mat-card-header>

  <mat-card-content>
    <mat-chip-set aria-label="Categoria do produto">
      <mat-chip>{{ nomeCategoria() }}</mat-chip>
      @if (!produto().emEstoque) {
        <mat-chip>Indisponível</mat-chip>
      }
    </mat-chip-set>

    <p class="preco-produto">
      {{ produto().preco | currency: 'BRL' : 'symbol' : '1.2-2' : 'pt-BR' }}
      <span>/ {{ produto().unidadeMedida }}</span>
    </p>
  </mat-card-content>

  <mat-card-actions align="end">
    <a mat-stroked-button [routerLink]="['/produtos', produto().id]">Ver detalhes</a>
    <button mat-flat-button type="button" [disabled]="!produto().emEstoque" (click)="adicionar()">
      Adicionar
    </button>
  </mat-card-actions>
</mat-card>
